<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- sky -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#1f4a73"/>
  <defs>
    <clipPath id="badge"><rect x="0" y="0" width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <!-- snow ridge: long massif with three summits -->
    <polygon fill="#ffffff" points="-2,46 6,34 14,26 22,30 30,21 40,26 48,19 56,27 66,36 66,66 -2,66"/>
    <!-- shadow facets on the snow -->
    <polygon fill="#a9c4dc" points="30,21 40,26 33,33"/>
    <polygon fill="#a9c4dc" points="48,19 56,27 47,31"/>
    <!-- foothills -->
    <polygon fill="#7a4a34" points="-2,60 8,53 16,57 26,51 36,56 46,52 56,56 66,52 66,66 -2,66"/>
  </g>
</svg>
