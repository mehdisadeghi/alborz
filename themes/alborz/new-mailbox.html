{{template "head.html" .}}
{{template "nav.html" .}}
{{template "util.html" .}}

<div class="page-wrap">
  {{ template "aside" . }}
  <div class="container">
    <main class="create-update">
      <form method="POST">
        <h2>{{$.T "folder.create"}}</h2>
        <label for="name">{{$.T "folder.name"}}</label>
        <input type="text" name="name" id="name" dir="auto" autofocus />
        {{ if .Error }}<p>{{ .Error }}</p>{{ end }}
        <div class="actions">
          <button type="submit">{{$.T "common.save"}}</button>
          <a class="button-link" href="/">{{$.T "common.cancel"}}</a>
        </div>
      </form>
    </main>
  </div>
</div>

{{template "foot.html"}}
