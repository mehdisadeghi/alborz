{{template "head.html" .}}
{{template "nav.html" .}}

<div class="page-wrap">
  <aside>
    <a href="/filters/create" class="new">{{$.T "filters.new"}}</a>
  </aside>

  <div class="container">
    <main class="task-list">
      <section class="tasks">
        {{ range .Scripts }}
        <div class="task-item">
          <div class="task-content">
            <a href="/filters/{{.Name | pathescape}}" class="task-summary">{{.Name}}</a>
            {{ if .Active }}
            <span class="task-due">{{$.T "filters.active"}}</span>
            {{ end }}
          </div>
          {{ if .Active }}
          <form method="post" action="/filters/deactivate">
            <button>{{$.T "filters.deactivate"}}</button>
          </form>
          {{ else }}
          <form method="post" action="/filters/{{.Name | pathescape}}/activate">
            <button>{{$.T "filters.activate"}}</button>
          </form>
          {{ end }}
          <form method="post" action="/filters/{{.Name | pathescape}}/delete">
            <button>{{$.T "common.delete"}}</button>
          </form>
        </div>
        {{ end }}
        {{ if not .Scripts }}
        <p class="empty-list">{{$.T "filters.empty"}}</p>
        {{ end }}
      </section>
    </main>
  </div>
</div>

{{template "foot.html"}}
