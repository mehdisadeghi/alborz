# Every push and pull request is tested. A version tag (or a manual run)
# also cross-builds the binary for the machines alborz is actually run
# on: a workstation or VPS (amd64), an ARM server or Apple-silicon VM
# (arm64), and a Raspberry Pi or comparable board (armv7); a tag
# attaches them to a release and publishes the images.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a branch supersedes the run still going; a tag's run always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check dependency vulnerabilities
        run: make vuln
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      # The minimal build differs only in what the add-ons wire in.
      - name: Vet and test without add-ons
        run: |
          go vet -tags noaddons ./...
          go test -tags noaddons ./cmd/alborz/app/ ./addons/...
      - name: Test browser scripts
        run: make test-js

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            variant: alborz
            build_tags: ""
          - goarch: amd64
            variant: alborz-minimal
            build_tags: noaddons
          - goarch: arm64
            variant: alborz
            build_tags: ""
          - goarch: arm64
            variant: alborz-minimal
            build_tags: noaddons
          - goarch: arm
            goarm: "7"
            variant: alborz
            build_tags: ""
          - goarch: arm
            goarm: "7"
            variant: alborz-minimal
            build_tags: noaddons
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BUILD_TAGS: ${{ matrix.build_tags }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          name="${VARIANT}-linux-${GOARCH}${GOARM:+v$GOARM}"
          # -trimpath keeps build machine paths out of the binary; the
          # version is the go tool's, from the checked-out commit and tag.
          go build -tags "$BUILD_TAGS" -trimpath -ldflags "-s -w" -o "$name" ./cmd/alborz
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-linux-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            ${{ matrix.variant }}-linux-*
          if-no-files-found: error

  desktop-macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      DESKTOP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build app and disk image
        run: make -f Makefile desktop-macos-dmg DESKTOP_ARCH=${{ matrix.arch }} DESKTOP_VERSION="${DESKTOP_VERSION#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: alborz-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.dmg
          if-no-files-found: error

  desktop-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      DESKTOP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: choco install make innosetup --no-progress -y
      - name: Build portable app and installer
        shell: bash
        run: make -f Makefile desktop-windows-installer DESKTOP_ARCH=${{ matrix.arch }} DESKTOP_VERSION="${DESKTOP_VERSION#v}" PYTHON=python ISCC="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: alborz-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [build, desktop-macos, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            alborz*-linux-*
            alborz-*-macos-*
            alborz-*-windows-*
          fail_on_unmatched_files: true
          # The commits since the previous tag are the release notes;
          # writing them by hand duplicates what the history already says.
          generate_release_notes: true

  # The latest release is latest (complete) and minimal (noaddons);
  # each release is also published as its version, v prefix removed.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            build_tags: ""
            channel_tag: latest
            tag_suffix: ""
          - variant: minimal
            build_tags: noaddons
            channel_tag: minimal
            tag_suffix: -minimal
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.channel_tag }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            GO_BUILD_TAGS=${{ matrix.build_tags }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
