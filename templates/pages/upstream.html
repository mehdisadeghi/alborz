{{ define "body" }}{{ template "bare" . }}{{ end }}
{{ define "main-class" }} class="error"{{ end }}
{{ define "main" }}
  <h1>{{.GlobalData.Title}}</h1>
  <p>{{.Said}}</p>
  <form method="post" action="{{url "auth.logout"}}" class="upstream-actions">
    <a class="button-link button-primary" href="{{.Retry}}">{{$.T "upstream.retry"}}</a>
    <button class="button-quiet">{{$.T "nav.signout"}}</button>
  </form>
{{ end }}
