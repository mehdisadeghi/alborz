# Cross-builds the binary for the machines alborz is actually run on:
# a workstation or VPS (amd64), an ARM server or Apple-silicon VM
# (arm64), and a Raspberry Pi or comparable board (armv7). Every push
# leaves downloadable artifacts; a tag also attaches them to a release,
# so a deploy never needs a Go toolchain on the target.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: full
            build_tags: ""
          - variant: core
            build_tags: noaddons
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test ${{ matrix.variant }}
        env:
          BUILD_TAGS: ${{ matrix.build_tags }}
        run: |
          go vet -tags "$BUILD_TAGS" ./...
          go test -tags "$BUILD_TAGS" ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            variant: alborz
            build_tags: ""
          - goarch: amd64
            variant: alborz-core
            build_tags: noaddons
          - goarch: arm64
            variant: alborz
            build_tags: ""
          - goarch: arm64
            variant: alborz-core
            build_tags: noaddons
          - goarch: arm
            goarm: "7"
            variant: alborz
            build_tags: ""
          - goarch: arm
            goarm: "7"
            variant: alborz-core
            build_tags: noaddons
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BUILD_TAGS: ${{ matrix.build_tags }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          name="${VARIANT}-linux-${GOARCH}${GOARM:+v$GOARM}"
          # -trimpath keeps build machine paths out of the binary; the
          # version is the go tool's, from the checked-out commit and tag.
          go build -tags "$BUILD_TAGS" -trimpath -ldflags "-s -w" -o "$name" ./cmd/alborz
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-linux-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            ${{ matrix.variant }}-linux-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: alborz*-linux-*
          fail_on_unmatched_files: true
          # The commits since the previous tag are the release notes;
          # writing them by hand duplicates what the history already says.
          generate_release_notes: true

  # The same builds as an image on ghcr.io: latest follows main, and a
  # tag, which is what a release is made from, gets its own.
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            build_tags: ""
            tag_suffix: ""
          - variant: core
            build_tags: noaddons
            tag_suffix: -core
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest${{ matrix.tag_suffix }},enable={{is_default_branch}}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            GO_BUILD_TAGS=${{ matrix.build_tags }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
