  "ton", "mon", "espace", "le", "la", "les", "du", "des", "et",
  "servicio", "servicios", "cliente", "clientes", "atencion", "al", "soporte", "ayuda",
  "facturacion", "factura", "pago", "pagos", "cuenta", "seguridad", "alerta", "aviso",
  "notificacion", "envio", "envios", "paquete", "entrega", "seguimiento", "pedido", "equipo",
