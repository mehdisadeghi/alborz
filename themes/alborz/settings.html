{{template "head.html" .}}
{{template "nav.html" .}}

<div class="page-wrap">
  <aside>
    <ul>
      <li>
        <a href="/mailbox/INBOX">« Back to inbox</a>
      </li>
    </ul>
  </aside>

  <div class="container">
    <main class="settings">
      <form method="post">
        <div class="action-group">
          <label for="from">Full name</label>
          <input
            type="text"
            name="from"
            id="from"
            dir="auto"
            value="{{.Settings.From}}"
          />
        </div>

        <div class="action-group">
          <label for="signature">Message signature</label>
          <textarea
            name="signature"
            id="signature"
            rows="5"
            dir="auto"
          >{{.Settings.Signature}}</textarea>
        </div>

        <div class="action-group">
          <label for="subscriptions">Subscribed folders</label>
          <select name="subscriptions" id="subscriptions" multiple>
            {{ $subs := .Subscriptions }}
            {{ range .Mailboxes }}
            {{ if and (ne .Name "INBOX") (not .IsInternal) }}
            <option
              value="{{.Name}}"
              {{ if $subs.Has .Name }}
              selected
              {{ end }}
            >{{.Name}}</option>
            {{ end }}
            {{ end }}
          </select>
        </div>

        <div class="action-group">
          <label for="messages_per_page">Messages per page</label>
          <input
            type="number"
            name="messages_per_page"
            id="messages_per_page"
            value="{{.Settings.MessagesPerPage}}"
            required />
        </div>

        <div class="action-group">
          <label for="search_body" class="checkbox">
            <input
              type="checkbox"
              name="search_body"
              id="search_body"
              {{ if not .Settings.SearchHeadersOnly }}checked{{ end }} />
            Search message bodies
          </label>
        </div>

        <div class="action-group">
          <label for="timezone">Timezone</label>
          <input
            type="text"
            name="timezone"
            id="timezone"
            value="{{.Settings.Timezone}}"
            placeholder="Auto-detect" />
          <small>Leave empty to auto-detect from browser</small>
        </div>

        <div class="action-group">
          <label for="theme">Theme</label>
          <select name="theme" id="theme">
            <option value="" {{if eq .Theme ""}}selected{{end}}>Default</option>
            <option value="sublime" {{if eq .Theme "sublime"}}selected{{end}}>Sublime</option>
            <option value="sourcehut" {{if eq .Theme "sourcehut"}}selected{{end}}>Sourcehut</option>
            <option value="glass" {{if eq .Theme "glass"}}selected{{end}}>Glass</option>
            <option value="ink" {{if eq .Theme "ink"}}selected{{end}}>Ink</option>
          </select>
        </div>

        <div class="action-group">
          <label for="color_scheme">Appearance</label>
          <select name="color_scheme" id="color_scheme">
            <option value="" {{if eq .ColorScheme ""}}selected{{end}}>System</option>
            <option value="light" {{if eq .ColorScheme "light"}}selected{{end}}>Light</option>
            <option value="dark" {{if eq .ColorScheme "dark"}}selected{{end}}>Dark</option>
          </select>
        </div>

        <div class="action-group">
          <label for="first_day_of_week">First day of week</label>
          <select name="first_day_of_week" id="first_day_of_week">
            <option value="1" {{if eq .Settings.FirstDayOfWeek 1}}selected{{end}}>Monday</option>
            <option value="0" {{if eq .Settings.FirstDayOfWeek 0}}selected{{end}}>Sunday</option>
            <option value="6" {{if eq .Settings.FirstDayOfWeek 6}}selected{{end}}>Saturday</option>
          </select>
        </div>

        <button type="submit">Save settings</button>
      </form>
    </main>
  </div>
</div>

{{template "foot.html"}}
