# The book of the brands add-on: the names scams borrow, and the domains each really sends from.
# The package comment in brands.go says how a name is read against it.
#
# names    Names that count wherever they stand as whole words in a display name. The warning
#          says the name as it is spelled here.
# alone    Names that are also an ordinary word or a surname. They count only where nothing but
#          service words stands beside them: "Wise Support", not "Penny Wise".
# domains  Where the brand's mail is From; an entry covers its subdomains. A domain whose own name
#          holds the name read needs no entry (amazon.de, paypal-communication.com, dhl-news.com):
#          list the main one and those that do not (amazonaws.com). A missing domain is a wrong
#          warning on real mail, so add a domain only from a message known to be the brand's, and
#          never one where anyone can have an address (icloud.com, outlook.com, t-online.de).
#
# Left out on purpose: products people run on their own servers, where every instance signs with
# the product's name (GitLab, WordPress, Nextcloud, Jira, SharePoint), names of mailbox services
# (Gmail, Outlook), and names that are plain words with no telling context (Orange, O2, Free,
# Otto, Uber, AT&T).

# Words that name nobody: a name listed alone still counts beside these, and a display name made
# of them alone lets the subject be read.
service = [
  "support", "team", "service", "services", "customer", "customers", "care", "help", "helpdesk",
  "desk", "center", "centre", "billing", "payment", "payments", "pay", "invoice", "invoices",
  "receipt", "account", "accounts", "security", "alert", "alerts", "notification", "notifications",
  "notice", "info", "information", "update", "updates", "mail", "email", "online", "official",
  "noreply", "no", "reply", "donotreply", "do", "not", "admin", "administrator", "department",
  "verification", "id", "store", "shop", "order", "orders", "bank", "banking", "card", "cards",
  "delivery", "shipping", "tracking", "parcel", "package", "express",
  "the", "of", "for", "by", "from", "and", "inc", "llc", "ltd", "plc", "corp", "corporation", "co",
  "gmbh", "ag", "se", "sa", "sas", "sl", "com", "net", "org", "de", "fr", "es", "uk", "us", "eu",
  "deutschland", "germany", "france", "espana", "europe",
  "kundenservice", "kundendienst", "kundenbetreuung", "kundencenter", "kunden", "hilfe",
  "rechnung", "rechnungen", "zahlung", "zahlungen", "konto", "sicherheit", "hinweis",
  "benachrichtigung", "mitteilung", "lieferung", "paket", "sendung", "sendungsverfolgung",
  "versand", "bestellung", "ihr", "ihre", "dein", "deine", "mein", "meine", "von", "und",
  "client", "clients", "clientele", "assistance", "aide", "facturation", "facture", "paiement",
