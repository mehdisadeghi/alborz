{{/* dict: name value label. */}}
{{ define "attachment-checkbox" }}
<div class="upload">
  <label class="filename">
    <input type="checkbox" name="{{.name}}" value="{{.value}}" checked>
    {{.label}}
  </label>
</div>
{{ end }}

{{/* The message's identity across submits, and the uploads the script adds to it. */}}
{{ define "compose-state" }}
<input type="hidden" name="message_id" value="{{.MessageID}}">
<input type="hidden" name="in_reply_to" value="{{.InReplyTo}}">
<input type="hidden" name="references" value="{{.References}}">
<input type="hidden" id="attachment-uuids" name="attachment-uuids" value="">
{{ end }}
