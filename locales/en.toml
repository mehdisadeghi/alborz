"tour.welcome.title" = "Welcome"
"tour.welcome.body" = "A short tour of the sections and the controls they share. Escape closes it; the accounts menu has it again."
"tour.sections.title" = "Sections"
"tour.sections.body" = "Mail, calendar, contacts, tasks, journal and filters. g then m, l, c, k, j or f goes to each."
"tour.search.title" = "Search"
"tour.search.body" = "One search across mail, events, tasks, journal and contacts. Press / or Ctrl K."
"tour.rail.title" = "Folders and views"
"tour.rail.body" = "Each account's folders, with Unread, Starred and the star colours under the inbox."
"tour.accounts.title" = "Accounts"
"tour.accounts.body" = "Switch account or show all of them at once, add one, sign out, and the keyboard shortcuts."
"tour.toolbar.title" = "Toolbar"
"tour.toolbar.body" = "Acts on the ticked rows. What does not fit moves into More; New stays."
"tour.rows.title" = "Rows"
"tour.rows.body" = "Tick a row to select it, press its star to mark it. On a phone, swipe a message aside to delete it or mark it as junk."
"tour.notices.title" = "Results and Undo"
"tour.notices.body" = "Every action states its result at the top of the page, with Undo where the server can take it back."
"tour.keys.title" = "Keyboard"
"tour.keys.body" = "j and k walk the rows, o opens, x ticks, s stars, c writes. ? lists every key."
"tour.scheme.title" = "Light and dark"
"tour.scheme.body" = "Follows the system; press to keep the page light or dark."
"tour.mail.title" = "Mail"
"tour.mail.body" = "A new message; c does the same. Mail files dropped on a folder are imported into it."
"tour.calendar.title" = "Calendar"
"tour.calendar.body" = "The month or a list of events, from every calendar of every account."
"tour.tasks.title" = "Tasks"
"tour.tasks.body" = "Type a task and press Enter to add it to the list chosen beside it."
"tour.contacts.title" = "Contacts"
"tour.contacts.body" = "Every address book of every account, with its groups in the rail. New adds a contact."
"tour.journal.title" = "Journal"
"tour.journal.body" = "Dated entries kept in your calendars, as other calendar apps write them."
"tour.filters.title" = "Filters"
"tour.filters.body" = "Rules the mail server runs as mail arrives: file, forward, or reply while away."
"tour.settings.title" = "Settings"
"tour.settings.body" = "Theme, text size, language, time zone and calendar, kept on every account. Each account's own pages are in the rail."
"tour.done.title" = "End of the tour"
"tour.done.body" = "Take the tour again from the accounts menu."
