<div class="message-list-checkbox">
  {{if not .GlobalData.Unified}}
  <input type="checkbox" id="action-checkbox-all" aria-label="{{$.T "mailbox.selectall"}}"/>
  {{end}}
</div>
<div class="actions-wrap">
  <div class="actions-message">
    {{if not .GlobalData.Unified}}
    <div class="action-group">
      <button form="address-book-form" formaction="/contacts/delete">{{$.T "common.delete"}}</button>
    </div>
    {{end}}
  </div>

  {{ template "toolbar-search" (dict "account" $.GlobalData.URLAccount "all" $.GlobalData.Unified "query" .Query "placeholder" ($.T "contacts.searchph") "button" ($.T "mailbox.search")) }}

</div>
