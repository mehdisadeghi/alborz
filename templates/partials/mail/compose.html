{{/* dict: message uploads. These fields keep compose identity and session uploads across submits. */}}
{{ define "compose-state" }}
<input type="hidden" name="message_id" value="{{.message.MessageID}}">
<input type="hidden" name="in_reply_to" value="{{.message.InReplyTo}}">
<input type="hidden" name="references" value="{{.message.References}}">
<input type="hidden" id="attachment-uuids" name="attachment-uuids" value="{{range $i, $u := .uploads}}{{if $i}},{{end}}{{$u.ID}}{{end}}" />
{{ end }}
